# CI 工作流
# 普通 PR 负责标题、目标分支、Dart 格式、analyze、test 与治理文件校验；
# 带 release 标签的 PR 额外校验发布分支与发布说明模板。
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

env:
  FLUTTER_VERSION: '3.44.0'

permissions:
  contents: read

jobs:
  pr-policy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 标题与目标分支
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          head_ref = os.environ["HEAD_REF"]
          base_ref = os.environ["BASE_REF"]
          author = os.environ["PR_AUTHOR"]
          labels = set(json.loads(os.environ["PR_LABELS"]))

          title_pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|deps|release)"
              r"(\([a-z0-9-]+\))?: .+"
          )
          if title_pattern.fullmatch(title) is None:
              print(
                  "PR 标题必须符合 type(scope): 中文摘要，例如 "
                  "fix(auth): 修复登录状态回退。",
                  file=sys.stderr,
              )
              sys.exit(1)

          if author != "dependabot[bot]" and re.search(r"[\u4e00-\u9fff]", title) is None:
              print("PR 标题摘要必须包含中文说明。", file=sys.stderr)
              sys.exit(1)

          # 校验分支命名（仅 Warning，不阻断）
          branch_pattern = re.compile(
              r"^(.*/)?(feature|bugfix|hotfix|release|docs|chore|refactor|test|ci|deps)/.+$"
          )
          if branch_pattern.fullmatch(head_ref) is None:
              print(
                  f"::warning::分支名 `{head_ref}` 不符合命名规范。"
                  "推荐格式：[prefix/](feature|bugfix|hotfix|release|docs|chore|refactor|test|ci|deps)/<topic-kebab-case>",
              )

          has_release_label = "release" in labels
          release_branch = re.fullmatch(
              r"release/v\d+\.\d+\.\d+(\.\d+)?(-(alpha|beta|rc|lts|hotfix))?",
              head_ref,
          )
          release_channel = None
          if release_branch is not None:
              release_channel = (release_branch.group(3) or "stable").lstrip("-")

          if base_ref == "main":
              if head_ref != "develop":
                  print(
                      "main 只接收 develop -> main 同步 PR。",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          elif base_ref != "develop":
              print(f"常规 PR 只能合入 develop，当前目标分支为 {base_ref}。", file=sys.stderr)
              sys.exit(1)

          if has_release_label:
              valid_prerelease = (
                  base_ref == "develop"
                  and release_channel in {"alpha", "beta", "rc"}
              )
              valid_stable_promotion = base_ref == "main" and head_ref == "develop"
              if not (valid_prerelease or valid_stable_promotion):
                  print(
                      "release label 只能用于 release/v*-alpha|beta|rc -> develop "
                      "或 develop -> main 的发布 PR。",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          PY

  governance-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 安装 YAML 校验依赖
        run: >
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r .github/requirements/governance.txt

      - name: 校验 GitHub 治理配置
        run: python scripts/ci/validate_github_governance.py

      - name: 测试清源设计契约校验器
        run: python scripts/ci/test_validate_design_system.py

      - name: 测试清源拆分样式校验器
        run: python scripts/ci/test_validate_design_stylesheets.py

      - name: 校验清源设计契约
        run: python scripts/ci/validate_design_system.py

      - name: 校验清源拆分样式加载链
        run: python scripts/ci/validate_design_stylesheets.py

      - name: 校验 Flutter 五平台 CI 矩阵
        run: python scripts/ci/validate_flutter_platform_ci.py

  design-prototype-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 安装页面原型核验依赖
        run: >
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r .github/requirements/design-prototype.txt

      - name: 安装 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: 浏览器核验清源页面原型
        run: python scripts/design/verify_design_prototype.py --output build/design-review

      - name: 核验首页稿外密度交互
        run: python scripts/design/check_home_density_interactions.py

      - name: 上传页面原型核验截图
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qingyuan-design-review
          path: build/design-review

  lore-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: 安装 Lore Protocol
        run: npm ci --prefix .github/npm/lore --ignore-scripts

      - name: 校验 Lore 配置
        run: ./.github/npm/lore/node_modules/.bin/lore doctor

      - name: 校验 PR 提交的 Lore 合规性
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ./.github/npm/lore/node_modules/.bin/lore validate "$BASE_SHA..$HEAD_SHA" || {
            echo "::warning::部分 commit 缺少 Lore 元数据，建议使用 lore commit 补充决策记录。"
          }

  quality-gate:
    name: Dart / Flutter Quality Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: Dart Format（仅检查 PR 变更的 Dart 文件）
        if: >
          github.event.pull_request.base.ref != 'main' ||
          github.event.pull_request.head.ref != 'develop'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.dart'
          )

          if [[ "${#dart_files[@]}" -eq 0 ]]; then
            echo "No changed Dart files."
            exit 0
          fi

          dart format --set-exit-if-changed "${dart_files[@]}"

      - name: Flutter Analyze（Dart 静态分析）
        run: flutter analyze --no-fatal-infos

      - name: Flutter Test（Dart / Widget 测试）
        run: flutter test

  platform-build-gate:
    name: Platform Build (${{ matrix.platform }})
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libnotify-dev libsecret-1-dev libjsoncpp-dev
          libayatana-appindicator3-dev

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 构建 Android
        if: matrix.platform == 'android'
        run: flutter build apk --debug

      - name: 构建 iOS
        if: matrix.platform == 'ios'
        run: flutter build ios --debug --no-codesign

      - name: 构建 Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --debug

      - name: 构建 macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --debug

      - name: 构建 Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --debug

  visual-candidate-matrix:
    name: Qingyuan Visual Candidates (${{ matrix.platform }})
    if: github.event.pull_request.draft == false
    needs: design-prototype-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Linux 原生能力依赖
        if: matrix.platform == 'linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libnotify-dev libsecret-1-dev libjsoncpp-dev
          libayatana-appindicator3-dev xvfb

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: Windows 原生能力冒烟
        if: matrix.platform == 'windows'
        run: >
          flutter test -d windows
          integration_test/qingyuan_platform_smoke_test.dart
          --timeout 180s

      - name: macOS 原生能力冒烟
        if: matrix.platform == 'macos'
        run: >
          flutter test -d macos
          integration_test/qingyuan_platform_smoke_test.dart
          --timeout 180s

      - name: Linux 原生能力冒烟
        if: matrix.platform == 'linux'
        run: >
          xvfb-run -a flutter test -d linux
          integration_test/qingyuan_platform_smoke_test.dart
          --timeout 180s

      - name: 在桌面 runner 采集清源视觉候选
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: >
          flutter test test/visual/qingyuan_visual_capture_test.dart
          --dart-define=QINGYUAN_VISUAL_CAPTURE=true
          --dart-define=QINGYUAN_VISUAL_PLATFORM=${{ matrix.platform }}
          --timeout 300s

      - name: 在 Android 模拟器采集清源视觉候选
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            flutter test -d emulator-5554 \
              integration_test/qingyuan_platform_smoke_test.dart \
              --timeout 180s
            flutter test -d emulator-5554 \
              integration_test/qingyuan_visual_capture_test.dart \
              --dart-define=QINGYUAN_VISUAL_CAPTURE=true \
              --dart-define=QINGYUAN_VISUAL_DEVICE_CAPTURE=true \
              --dart-define=QINGYUAN_VISUAL_PLATFORM=android \
              --timeout 300s

      - name: 启动 iOS 模拟器
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          device_id="$({ xcrun simctl list devices available -j; } | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              device["udid"]
              for runtime in devices.values()
              for device in runtime
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(candidates[0])
          ')"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "QINGYUAN_IOS_DEVICE=$device_id" >> "$GITHUB_ENV"

      - name: iOS 原生能力冒烟
        if: matrix.platform == 'ios'
        run: >
          flutter test -d "${{ env.QINGYUAN_IOS_DEVICE }}"
          integration_test/qingyuan_platform_smoke_test.dart
          --timeout 180s

      - name: 在 iOS 模拟器采集清源视觉候选
        if: matrix.platform == 'ios'
        run: >
          flutter test -d "${{ env.QINGYUAN_IOS_DEVICE }}"
          integration_test/qingyuan_visual_capture_test.dart
          --dart-define=QINGYUAN_VISUAL_CAPTURE=true
          --dart-define=QINGYUAN_VISUAL_DEVICE_CAPTURE=true
          --dart-define=QINGYUAN_VISUAL_PLATFORM=ios
          --timeout 300s

      - name: 校验视觉候选清单、尺寸与外部区域
        run: >
          python scripts/ci/validate_visual_artifacts.py
          --root build/visual/${{ matrix.platform }}
          --manifest docs/design/resources/visual-manifest.json
          --platform ${{ matrix.platform }}

      - name: 上传清源视觉候选
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qingyuan-visual-candidates-${{ matrix.platform }}
          path: build/visual/${{ matrix.platform }}
          if-no-files-found: error

  release-policy:
    if: >
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: release
        uses: ./.github/actions/release-context

      - name: 校验 Release PR 目标分支
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_CHANNEL" == "stable" || "$RELEASE_CHANNEL" == "lts" || "$RELEASE_CHANNEL" == "hotfix" ]]; then
            [[ "$BASE_REF" == "main" ]] || {
              echo "stable / lts / hotfix Release PR 只能合并到 main，当前目标分支为 $BASE_REF。" >&2
              exit 1
            }
            [[ "$HEAD_REF" == "develop" ]] || {
              echo "stable / lts / hotfix Release PR 只能使用 develop -> main 晋级流程，当前源分支为 $HEAD_REF。" >&2
              exit 1
            }
            exit 0
          fi

          [[ "$BASE_REF" == "develop" ]] || {
            echo "alpha / beta / rc Release PR 只能合并到 develop，当前目标分支为 $BASE_REF。" >&2
            exit 1
          }

          [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-(alpha|beta|rc)$ ]] || {
            echo "alpha / beta / rc Release PR 源分支必须是 release/v...-$RELEASE_CHANNEL，当前源分支为 $HEAD_REF。" >&2
            exit 1
          }

      - name: 校验 Release PR 正文模板
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > pr-body.md
          python scripts/release/render_release_notes.py \
            --body-file pr-body.md \
            --output release-notes.md \
            --validate-only
