# Semgrep — 安全规则扫描
name: Semgrep

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '45 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b # latest digest captured 2026-06-13
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output=semgrep-results.sarif --error
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: semgrep-results.sarif
