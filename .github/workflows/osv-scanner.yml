# OSV Scanner — 依赖漏洞扫描
name: OSV Scanner

on:
  push:
    branches: [develop, main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --output-format=sarif
            --output=osv-results.sarif
            .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: osv-results.sarif
