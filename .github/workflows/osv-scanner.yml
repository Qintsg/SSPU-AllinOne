# OSV Scanner — 依赖漏洞扫描
name: OSV Scanner

on:
  push:
    branches: [develop, main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 安装 osv-scanner
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: 运行漏洞扫描
        run: |
          set -euo pipefail
          osv-scanner scan --lockfile=pubspec.lock --format=sarif --output=osv-results.sarif . || true

      - name: 上传 SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: osv-results.sarif
