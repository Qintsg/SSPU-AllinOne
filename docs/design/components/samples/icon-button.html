<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IconButton 图标按钮样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>IconButton 图标按钮</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 44×44 触控区</p>

    <div class="section">
      <h2>Outline 描边</h2>
      <p class="label">顶栏 / 工具栏次要操作 · 悬停转青雾</p>
      <div class="row">
        <button class="yh-icon-btn" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
        <button class="yh-icon-btn" aria-label="通知"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        <button class="yh-icon-btn" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        <button class="yh-icon-btn" aria-label="不可用" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
    </div>

    <div class="section">
      <h2>Ghost 无边框</h2>
      <p class="label">列表尾随 / 卡片角落 · 悬停加青雾浅底</p>
      <div class="row">
        <button class="yh-icon-btn ghost" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <button class="yh-icon-btn ghost" aria-label="收藏"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
        <button class="yh-icon-btn ghost" aria-label="编辑"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
