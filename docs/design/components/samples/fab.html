<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAB 悬浮行动按钮样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>FAB 悬浮行动按钮</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 页面唯一主行动</p>

    <div class="section">
      <h2>Regular 圆角方</h2>
      <p class="label">图标含义明确时 · 56×56</p>
      <div class="row">
        <button class="yh-fab" aria-label="新建"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="yh-fab" aria-label="写消息"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </div>

    <div class="section">
      <h2>Extended 胶囊</h2>
      <p class="label">首次引导 / 含义需文字补充</p>
      <div class="row">
        <button class="yh-fab extended" aria-label="新建课程">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新建课程
        </button>
        <button class="yh-fab extended" aria-label="写反馈">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          写反馈
        </button>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
