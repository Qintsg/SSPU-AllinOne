<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio 单选样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Radio 单选</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 组内互斥</p>

    <div class="section">
      <h2>排序方式（单选）</h2>
      <p class="label">点击切换 · 组内只能选一项</p>
      <div class="col" data-radio-group>
        <label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer"><span class="yh-radio on"></span> 按时间</label>
        <label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer"><span class="yh-radio"></span> 按热度</label>
        <label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer"><span class="yh-radio"></span> 按学院</label>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
