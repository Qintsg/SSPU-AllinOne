<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Button 按钮样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Button 按钮</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 四变体五态</p>

    <div class="section">
      <h2>Primary 实心按钮</h2>
      <p class="label">主要行动 · 一屏至多 1 个</p>
      <div class="row">
        <button class="yh-button primary">提交申请</button>
        <button class="yh-button primary">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          保存
        </button>
        <button class="yh-button primary" disabled>不可用</button>
      </div>
    </div>

    <div class="section">
      <h2>Secondary 描边按钮</h2>
      <p class="label">次要行动 · 取消 / 返回</p>
      <div class="row">
        <button class="yh-button secondary">取消</button>
        <button class="yh-button secondary">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          返回
        </button>
        <button class="yh-button secondary" disabled>不可用</button>
      </div>
    </div>

    <div class="section">
      <h2>Text 文本按钮</h2>
      <p class="label">低优先级 · 了解更多 / 跳过</p>
      <div class="row">
        <button class="yh-button text">了解更多</button>
        <button class="yh-button text">跳过</button>
        <button class="yh-button text" disabled>不可用</button>
      </div>
    </div>

    <div class="section">
      <h2>Danger 危险按钮 + 尺寸</h2>
      <p class="label">破坏性行动 · 以及 sm 小尺寸（桌面 40dp）</p>
      <div class="row">
        <button class="yh-button danger">删除账号</button>
        <button class="yh-button primary sm">保存</button>
        <button class="yh-button secondary sm">取消</button>
      </div>
    </div>

    <div class="section">
      <h2>组合场景</h2>
      <p class="label">一屏一主 · 其余降级（试试 Tab 聚焦、悬停、按下）</p>
      <div class="row">
        <button class="yh-button primary">确认提交</button>
        <button class="yh-button secondary">取消</button>
        <button class="yh-button text">保存草稿</button>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
