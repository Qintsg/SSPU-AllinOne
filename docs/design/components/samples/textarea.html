<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Textarea 多行文本框样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Textarea 多行文本框</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 顶部对齐 · 实时计数</p>

    <div class="section">
      <h2>意见反馈（上限 200）</h2>
      <p class="label">输入即更新右下计数 · 超限自动截断</p>
      <div class="yh-field">
        <span class="flabel">意见反馈</span>
        <div class="control" style="height:auto;align-items:stretch">
          <textarea rows="4" placeholder="说说你的想法…" data-max="200"></textarea>
        </div>
        <span class="helper"><span class="count">0 / 200</span>请文明发言</span>
      </div>
    </div>

    <div class="section">
      <h2>已填 / 禁用</h2>
      <p class="label">填充态与禁用态</p>
      <div class="col" style="gap:20px">
        <div class="yh-field">
          <span class="flabel">课程评价</span>
          <div class="control" style="height:auto;align-items:stretch">
            <textarea rows="3" data-max="200">老师讲得很清楚，作业量适中，希望多一些课堂实践环节。</textarea>
          </div>
          <span class="helper"><span class="count">28 / 200</span></span>
        </div>
        <div class="yh-field disabled">
          <span class="flabel">系统备注</span>
          <div class="control" style="height:auto;align-items:stretch">
            <textarea rows="2" disabled>本字段由系统自动填写，不可编辑。</textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
