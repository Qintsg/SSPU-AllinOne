<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select 下拉选择样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Select 下拉选择</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 点击展开 · 点空白关闭</p>

    <div class="section">
      <h2>未选（占位态）</h2>
      <p class="label">点击触发器展开浮层，选中后收起</p>
      <div class="yh-field yh-select">
        <span class="flabel">学期</span>
        <div class="control">
          <span class="val placeholder">请选择学期</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="yh-select-menu">
          <div class="opt" data-label="2025 秋季学期">2025 秋季学期 <svg class="tick" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="opt" data-label="2025 春季学期">2025 春季学期 <svg class="tick" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="opt" data-label="2024 秋季学期">2024 秋季学期 <svg class="tick" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>已选（含选中勾）</h2>
      <p class="label">选中项青雾字 + 右侧勾</p>
      <div class="yh-field yh-select">
        <span class="flabel">学院</span>
        <div class="control">
          <span class="val">计算机与信息工程学院</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="yh-select-menu">
          <div class="opt sel" data-label="计算机与信息工程学院">计算机与信息工程学院 <svg class="tick" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="opt" data-label="经济与管理学院">经济与管理学院 <svg class="tick" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="opt" data-label="环境与材料工程学院">环境与材料工程学院 <svg class="tick" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
