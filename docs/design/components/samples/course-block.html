<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CourseBlock 课程块样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
  <style>
    .yh-course.ongoing { box-shadow: inset 0 0 0 1.5px var(--brand-strong); }
    .yh-course.empty { background: transparent; border: 1.5px dashed var(--border); }
    .yh-course.empty b, .yh-course.empty span { color: var(--muted); }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>CourseBlock 课程块</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 课表网格单元</p>

    <div class="section">
      <h2>default / 进行中 / 空教室</h2>
      <p class="label">整块上色，不用左色条</p>
      <div class="row" style="align-items:stretch">
        <div class="yh-course"><b>数据结构</b><span>教三-401 · 王老师</span><span>10:00–11:40</span></div>
        <div class="yh-course ongoing"><b>高等数学</b><span>教二-205 · 李老师</span><span>14:00–15:40 · 进行中</span></div>
        <div class="yh-course empty"><b>空教室</b><span>16:00–17:40</span></div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
