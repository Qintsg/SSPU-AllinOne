<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stepper 步进器样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Stepper 步进器</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 小整数增减</p>

    <div class="section">
      <h2>份数（1–10）</h2>
      <p class="label">点 − / + 调节 · 到边界自动禁用</p>
      <div class="row">
        <div class="yh-stepper" data-min="1" data-max="10">
          <button data-act="dec" aria-label="减少">−</button>
          <span class="val">2</span>
          <button data-act="inc" aria-label="增加">+</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>到下限禁用</h2>
      <p class="label">值已到 min=0，减按钮禁用</p>
      <div class="row">
        <div class="yh-stepper" data-min="0" data-max="5">
          <button data-act="dec" aria-label="减少" disabled>−</button>
          <span class="val">0</span>
          <button data-act="inc" aria-label="增加">+</button>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
