<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ListItem 列表行样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>ListItem 列表行</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 前导 + 主次文 + 尾随</p>

    <div class="section">
      <h2>通知列表</h2>
      <p class="label">悬停高亮 · 主文截断 · 尾随时间 / 箭头</p>
      <div class="yh-list">
        <div class="row">
          <span class="lead">图</span>
          <div class="main"><b>图书馆开放时间调整公告</b><span>信息公开网 · 今天 09:20</span></div>
          <span class="trail"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="row">
          <span class="lead">教</span>
          <div class="main"><b>期末成绩已发布</b><span>教务处 · 昨天</span></div>
          <span class="trail"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="row">
          <span class="lead"><svg viewBox="0 0 24 24"><path d="M22 10L12 5 2 10l10 5 10-5z"/></svg></span>
          <div class="main"><b>第二课堂学分认定结果</b><span>团委 · 3 天前</span></div>
          <span class="trail"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
