<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AttendanceItem 考勤签到行样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>AttendanceItem 考勤签到行</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 点「签到」即时完成</p>

    <div class="section">
      <h2>待签到 / 已签 / 缺勤</h2>
      <p class="label">点第一条的「签到」按钮，状态变为已签</p>
      <div class="col" style="gap:12px">
        <div class="yh-attend" id="att1">
          <div class="m"><b>晨跑打卡</b><span>6:30–7:30 · 田径场</span></div>
          <div class="act">
            <span class="yh-pill warn">待签到</span>
            <button class="yh-button primary sm" onclick="checkIn()">签到</button>
          </div>
        </div>
        <div class="yh-attend">
          <div class="m"><b>体育课（篮球）</b><span>14:00–15:40 · 体育馆</span></div>
          <div class="act"><span class="yh-pill ok">已签 14:02</span></div>
        </div>
        <div class="yh-attend">
          <div class="m"><b>形势与政策讲座</b><span>昨天 19:00 · 报告厅</span></div>
          <div class="act"><span class="yh-pill err">缺勤</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
  <script>
    function checkIn() {
      var t = new Date();
      var hh = String(t.getHours()).padStart(2, '0');
      var mm = String(t.getMinutes()).padStart(2, '0');
      document.querySelector('#att1 .act').innerHTML = '<span class="yh-pill ok">已签 ' + hh + ':' + mm + '</span>';
    }
  </script>
</body>
</html>
