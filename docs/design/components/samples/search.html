<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search 搜索框样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Search 搜索框</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 浅底胶囊 · 前置图标与文本竖向居中不重合</p>

    <div class="section">
      <h2>空态（占位符可见）</h2>
      <p class="label">前置放大镜 · 占位符 --muted，不再隐形</p>
      <div class="yh-field yh-search">
        <div class="control">
          <svg class="ic prefix" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" placeholder="搜索课程、通知、同学…" />
        </div>
      </div>
    </div>

    <div class="section">
      <h2>已输入（前置图标 + 文本 + 尾随清除）</h2>
      <p class="label">三者同行居中 · 点 × 清除</p>
      <div class="yh-field yh-search">
        <div class="control">
          <svg class="ic prefix" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" value="数据结构" />
          <svg class="ic suffix" viewBox="0 0 24 24" aria-label="清除"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>聚焦态</h2>
      <p class="label">聚焦时转白底 + 青雾边框，前置图标同步变青雾（点进去看）</p>
      <div class="yh-field yh-search">
        <div class="control">
          <svg class="ic prefix" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" placeholder="点我聚焦" />
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
  <script>
    // 搜索框尾随 × 清除（样例级）
    document.addEventListener('click', function (e) {
      var x = e.target.closest('.yh-search .ic.suffix');
      if (!x) return;
      var inp = x.closest('.control').querySelector('input');
      if (inp) { inp.value = ''; inp.focus(); }
    });
  </script>
</body>
</html>
