<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MetricCard 指标卡样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>MetricCard 指标卡</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 等宽数值 + 趋势</p>

    <div class="section">
      <h2>关键指标</h2>
      <p class="label">数值等宽对齐 · 趋势色 + 箭头双编码</p>
      <div class="row">
        <div class="yh-metric">
          <div class="lab"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>校园卡余额</div>
          <div class="v">¥128.50</div>
          <div class="d down">↓ 本月 −¥86</div>
        </div>
        <div class="yh-metric">
          <div class="lab"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>本月出勤率</div>
          <div class="v">96.4%</div>
          <div class="d up">↑ 较上月 +2.1%</div>
        </div>
        <div class="yh-metric">
          <div class="lab"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>待办事项</div>
          <div class="v">7</div>
          <div class="d">3 项今日截止</div>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
