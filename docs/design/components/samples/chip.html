<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chip 筹码样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Chip 筹码</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 可多选筛选</p>

    <div class="section">
      <h2>Filter 筛选（可多选）</h2>
      <p class="label">点击切换选中 · 选中填青雾浅底</p>
      <div class="row">
        <span class="yh-chip on"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>已选</span>
        <span class="yh-chip">教务</span>
        <span class="yh-chip">课表</span>
        <span class="yh-chip">资讯</span>
        <span class="yh-chip">财务</span>
        <span class="yh-chip">第二课堂</span>
      </div>
    </div>

    <div class="section">
      <h2>Input 标签（带删除）</h2>
      <p class="label">已输入的标签，× 可删除</p>
      <div class="row">
        <span class="yh-chip on">高等数学 <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
        <span class="yh-chip on">数据结构 <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
        <span class="yh-chip on">操作系统 <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
