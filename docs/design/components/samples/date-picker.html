<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DatePicker 日期选择样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>DatePicker 日期选择</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 今天描环、选中实心</p>

    <div class="section">
      <h2>单日选择（2026 年 6 月）</h2>
      <p class="label">点日期切换选中 · 17 日今天（环）· 21 日已选（实心）</p>
      <div class="yh-cal" id="cal">
        <div class="yh-cal__head">
          <button aria-label="上个月"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="m">2026 年 6 月</span>
          <button aria-label="下个月"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="yh-cal__grid">
          <span class="wd">日</span><span class="wd">一</span><span class="wd">二</span><span class="wd">三</span><span class="wd">四</span><span class="wd">五</span><span class="wd">六</span>
          <span class="d mute">31</span><span class="d">1</span><span class="d">2</span><span class="d">3</span><span class="d">4</span><span class="d">5</span><span class="d">6</span>
          <span class="d">7</span><span class="d">8</span><span class="d">9</span><span class="d">10</span><span class="d">11</span><span class="d">12</span><span class="d">13</span>
          <span class="d">14</span><span class="d">15</span><span class="d">16</span><span class="d today">17</span><span class="d">18</span><span class="d">19</span><span class="d">20</span>
          <span class="d sel">21</span><span class="d">22</span><span class="d">23</span><span class="d">24</span><span class="d">25</span><span class="d">26</span><span class="d">27</span>
          <span class="d">28</span><span class="d">29</span><span class="d">30</span><span class="d mute">1</span><span class="d mute">2</span><span class="d mute">3</span><span class="d mute">4</span>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
  <script>
    // 日期选择（样例级）：点本月日切换选中
    document.getElementById('cal').addEventListener('click', function (e) {
      var d = e.target.closest('.d');
      if (!d || d.classList.contains('mute')) return;
      this.querySelectorAll('.d.sel').forEach(function (x) { x.classList.remove('sel'); });
      d.classList.add('sel');
    });
  </script>
</body>
</html>
