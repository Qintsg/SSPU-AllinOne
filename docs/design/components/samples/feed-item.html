<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FeedItem 资讯条目样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>FeedItem 资讯条目</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 来源 + 时间 + 标题 + 摘要</p>

    <div class="section">
      <h2>资讯流</h2>
      <p class="label">来源标 + 时间常驻 · 摘要 2 行截断 · 悬停描边青雾</p>
      <div class="col" style="gap:14px">
        <div class="yh-feed">
          <div class="top"><span class="src"><svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>信息公开网</span> · 2 小时前</div>
          <h4>图书馆开放时间调整公告</h4>
          <p>自下周起，图书馆周末开放时间延长至 22:00，自习区与借阅区同步调整，期末周将进一步通宵开放，具体安排见馆内通知。</p>
        </div>
        <div class="yh-feed">
          <div class="top"><span class="src">教务处</span> · 昨天</div>
          <h4>关于 2026 春季学期期末考试安排的通知</h4>
          <p>本学期期末考试定于第 18–19 周进行，请同学们登录教务系统查询具体考场与座位号，按时参加考试。</p>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
