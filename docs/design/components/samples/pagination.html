<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagination 分页样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Pagination 分页</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 当前页青雾实心</p>

    <div class="section">
      <h2>完整分页（含省略号）</h2>
      <p class="label">点页码切换 active · 首页禁用上一页</p>
      <div class="yh-pagination">
        <button disabled aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="on" data-page="1">1</button>
        <button data-page="2">2</button>
        <button data-page="3">3</button>
        <span class="ellipsis">…</span>
        <button data-page="12">12</button>
        <button aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>

    <div class="section">
      <h2>中间页</h2>
      <p class="label">当前第 5 页，首尾省略</p>
      <div class="yh-pagination">
        <button aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button data-page="1">1</button>
        <span class="ellipsis">…</span>
        <button data-page="4">4</button>
        <button class="on" data-page="5">5</button>
        <button data-page="6">6</button>
        <span class="ellipsis">…</span>
        <button data-page="12">12</button>
        <button aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
