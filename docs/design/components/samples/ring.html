<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring 环形进度样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Ring 环形进度</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · conic-gradient 扇区 + 中心数值</p>

    <div class="section">
      <h2>不同完成度</h2>
      <p class="label">中心显百分比 / 分数</p>
      <div class="row" style="gap:24px">
        <div class="yh-ring" style="background:conic-gradient(var(--brand-strong) 36%, var(--border) 0)"><i>36%</i></div>
        <div class="yh-ring" style="background:conic-gradient(var(--brand-strong) 72%, var(--border) 0)"><i>72%</i></div>
        <div class="yh-ring" style="background:conic-gradient(var(--brand-strong) 90%, var(--border) 0)"><i>9/10</i></div>
        <div class="yh-ring" style="background:conic-gradient(var(--success) 100%, var(--border) 0)"><i style="color:var(--success)">✓</i></div>
      </div>
    </div>

    <div class="section">
      <h2>未知进度</h2>
      <p class="label">只表达“加载中”，不伪造完成百分比；减少动态时停在固定帧。</p>
      <div class="yh-ring activity" role="progressbar" aria-label="正在加载" aria-valuetext="加载中"><i aria-hidden="true"></i></div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
