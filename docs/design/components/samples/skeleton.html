<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton 骨架屏样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Skeleton 骨架屏</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 低幅透明度脉冲</p>

    <div class="section">
      <h2>文本行 + 图块</h2>
      <p class="label">行宽参差模拟真实文本 · 块占位图片</p>
      <div class="yh-skeleton">
        <i style="width:70%"></i>
        <i style="width:92%"></i>
        <i style="width:50%"></i>
        <i class="block"></i>
      </div>
    </div>

    <div class="section">
      <h2>列表行骨架</h2>
      <p class="label">前导圆 + 两行文本，尺寸贴近真实 ListItem</p>
      <div class="yh-card" style="max-width:460px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div class="yh-skeleton" style="width:38px"><i class="block" style="height:38px;border-radius:50%;margin:0"></i></div>
          <div class="yh-skeleton" style="flex:1"><i style="width:60%"></i><i style="width:40%;margin-bottom:0"></i></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="yh-skeleton" style="width:38px"><i class="block" style="height:38px;border-radius:50%;margin:0"></i></div>
          <div class="yh-skeleton" style="flex:1"><i style="width:75%"></i><i style="width:35%;margin-bottom:0"></i></div>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
