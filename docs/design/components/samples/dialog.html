<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dialog 对话框样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
  <style>
    /* 样例级：真实模态遮罩 */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; place-items: center; z-index: 200; padding: 20px; }
    .scrim.show { display: grid; }
    .scrim .yh-dialog { animation: dlg-in var(--duration-base) var(--curve); }
    @keyframes dlg-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Dialog 对话框</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 阻断式确认</p>

    <div class="section">
      <h2>静态预览</h2>
      <p class="label">遮罩聚焦 + 居中面板 · 危险操作用红按钮</p>
      <div class="yh-dialog-demo">
        <div class="yh-dialog">
          <h3>删除该课程？</h3>
          <p>此操作不可撤销，删除后需重新从教务系统导入课表。</p>
          <div class="acts">
            <button class="yh-button text sm">取消</button>
            <button class="yh-button danger sm">删除</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>触发演示</h2>
      <p class="label">点击打开真实模态 · 点遮罩或取消关闭</p>
      <button class="yh-button primary" onclick="openDlg()">退出登录</button>
    </div>
  </div>

  <div class="scrim" id="scrim" onclick="if(event.target===this)closeDlg()">
    <div class="yh-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
      <h3 id="dlg-t">确认退出登录？</h3>
      <p>退出后需重新输入学号和密码才能进入工大聚合。</p>
      <div class="acts">
        <button class="yh-button text sm" onclick="closeDlg()">取消</button>
        <button class="yh-button primary sm" onclick="closeDlg()">退出</button>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
  <script>
    function openDlg() { document.getElementById('scrim').classList.add('show'); }
    function closeDlg() { document.getElementById('scrim').classList.remove('show'); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDlg(); });
  </script>
</body>
</html>
