<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accordion 折叠面板样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Accordion 折叠面板</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 点标题行展开/收起</p>

    <div class="section">
      <h2>常见问题 FAQ</h2>
      <p class="label">可多项同时展开 · chevron 旋转反馈</p>
      <div class="yh-accordion">
        <div class="item open">
          <div class="head">如何查询考试安排？<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="body"><p>进入「教务 → 考试」即可查看本学期所有考试的时间、地点与座位号。考试前 3 天会推送提醒。</p></div>
        </div>
        <div class="item">
          <div class="head">校园卡丢了怎么办？<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="body"><p>在「服务 → 校园卡」点击挂失，到一卡通中心补办。挂失期间余额会冻结，补办后自动恢复。</p></div>
        </div>
        <div class="item">
          <div class="head">第二课堂学分怎么认定？<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="body"><p>参加活动后在「第二课堂」提交材料，由学院团委审核，审核通过后学分自动计入成绩单。</p></div>
        </div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
