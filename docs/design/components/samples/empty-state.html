<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EmptyState 空状态样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>EmptyState 空状态</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 给指引而非指责</p>

    <div class="section">
      <h2>暂无数据</h2>
      <div class="yh-empty">
        <span class="art"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <b>暂无消息</b>
        <p>新的通知会出现在这里</p>
      </div>
    </div>

    <div class="section">
      <h2>搜索无结果</h2>
      <div class="yh-empty">
        <span class="art"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
        <b>没有找到相关结果</b>
        <p>换个关键词，或清除筛选条件再试</p>
        <div class="foot"><button class="yh-button text sm">清除筛选</button></div>
      </div>
    </div>

    <div class="section">
      <h2>引导创建</h2>
      <div class="yh-empty">
        <span class="art"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M12 10v6M9 13h6M8 2v4M16 2v4"/></svg></span>
        <b>还没有课程安排</b>
        <p>从教务系统导入课表，或手动添加一节课</p>
        <div class="foot"><button class="yh-button primary sm">导入课表</button></div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
