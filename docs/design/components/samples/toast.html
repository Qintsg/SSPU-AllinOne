<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toast 轻提示样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
  <style>
    /* 样例级：触发态 toast 的浮层定位与动画 */
    #toast-host { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    #toast-host .yh-toast { opacity: 0; transform: translateY(12px); transition: opacity 200ms ease, transform 200ms ease; }
    #toast-host .yh-toast.in { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Toast 轻提示</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 瞬时反馈，自动消失</p>

    <div class="section">
      <h2>三变体（静态）</h2>
      <p class="label">dark / brand / success</p>
      <div class="col">
        <div class="yh-toast dark"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>链接已复制</div>
        <div class="yh-toast brand"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>课程提醒已设定</div>
        <div class="yh-toast success"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>已签到成功</div>
      </div>
    </div>

    <div class="section">
      <h2>触发演示</h2>
      <p class="label">点击按钮，Toast 从底部滑入，2 秒后淡出</p>
      <div class="row">
        <button class="yh-button primary" onclick="showToast('已签到成功','success')">签到</button>
        <button class="yh-button secondary" onclick="showToast('链接已复制','dark')">复制链接</button>
      </div>
    </div>
  </div>

  <div id="toast-host"></div>

  <script src="_qingyuan.js"></script>
  <script>
    function showToast(text, kind) {
      var host = document.getElementById('toast-host');
      var t = document.createElement('div');
      t.className = 'yh-toast ' + (kind || 'dark');
      t.innerHTML = '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6L9 17l-5-5"/></svg>' + text;
      host.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('in'); });
      setTimeout(function () { t.classList.remove('in'); setTimeout(function () { t.remove(); }, 220); }, 2000);
    }
  </script>
</body>
</html>
