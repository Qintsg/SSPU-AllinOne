<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AppBar 顶栏样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>AppBar 顶栏</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 返回 + 标题 + 动作</p>

    <div class="section">
      <h2>Surface 浅底</h2>
      <p class="label">内容页默认</p>
      <div class="yh-appbar">
        <button class="ib" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <span class="ttl">课程表</span>
        <button class="ib" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
        <button class="ib" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </div>
    </div>

    <div class="section">
      <h2>Brand 青雾实心</h2>
      <p class="label">首页 / 重点页强调</p>
      <div class="yh-appbar brand">
        <button class="ib" aria-label="菜单"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <span class="ttl">工大聚合</span>
        <button class="ib" aria-label="通知"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
