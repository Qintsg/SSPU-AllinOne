<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slider 滑块样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Slider 滑块</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 拖动取值</p>

    <div class="section">
      <h2>Continuous 连续</h2>
      <p class="label">亮度 / 音量 · 拖动即时调节</p>
      <div class="col">
        <input class="yh-slider" type="range" min="0" max="100" value="64" aria-label="亮度" />
        <input class="yh-slider" type="range" min="0" max="100" value="30" aria-label="音量" />
      </div>
    </div>

    <div class="section">
      <h2>Discrete 分档</h2>
      <p class="label">字号 S / M / L · 带刻度</p>
      <div class="row">
        <input class="yh-slider" type="range" min="0" max="2" step="1" value="1" list="fontmarks" aria-label="字号" />
        <datalist id="fontmarks"><option value="0">S</option><option value="1">M</option><option value="2">L</option></datalist>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
