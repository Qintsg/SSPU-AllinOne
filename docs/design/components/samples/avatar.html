<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar 头像样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Avatar 头像</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 文字回退 · 三尺寸</p>

    <div class="section">
      <h2>尺寸 sm / md / lg</h2>
      <div class="row" style="align-items:flex-end">
        <span class="yh-avatar sm">饶</span>
        <span class="yh-avatar md">王</span>
        <span class="yh-avatar lg">李</span>
      </div>
    </div>

    <div class="section">
      <h2>实心 / 叠 Badge</h2>
      <p class="label">fill 表示当前用户 · 可叠未读红点</p>
      <div class="row" style="gap:24px">
        <span class="yh-avatar md fill">我</span>
        <span class="yh-avatar lg fill">饶</span>
        <span class="yh-badge dot"><span class="yh-avatar md">张</span></span>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
