<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card 卡片样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Card 卡片</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · outlined / elevated</p>

    <div class="section">
      <h2>Outlined 描边卡</h2>
      <p class="label">列表内密集卡片（默认）</p>
      <div class="yh-card">
        <div class="ttl">缴费通知</div>
        <div class="desc">本学期学费缴纳截止日期为 6 月 30 日，请尽快完成缴费。</div>
        <div class="foot">
          <button class="yh-button primary sm">立即缴费</button>
          <button class="yh-button text sm">稍后提醒</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Elevated 浮起卡</h2>
      <p class="label">需从背景中强调时</p>
      <div class="yh-card elevated">
        <div class="ttl">今日课程提醒</div>
        <div class="desc">下午 14:00 在教三-401 有《数据结构》课程。</div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
