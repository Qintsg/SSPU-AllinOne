<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banner 横幅提示样例 · 清源设计系统</title>
  <link rel="stylesheet" href="_qingyuan.css" />
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tt-label">深色</span>
  </button>

  <div class="container">
    <h1>Banner 横幅提示</h1>
    <p class="intro">清源设计系统 · 响应色 <b>#478384</b> · 四语义持续提示</p>

    <div class="section">
      <h2>四种语义</h2>
      <p class="label">浅底 + 同色相深字 · 克制不刺眼</p>
      <div class="col">
        <div class="yh-banner info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>数据仅保留在本地设备，不会上传服务器。</div>
        <div class="yh-banner success"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>缴费成功，电子票据已生成。</div>
        <div class="yh-banner warn"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>今晚 23:00–24:00 系统维护，期间部分服务不可用。</div>
        <div class="yh-banner danger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>表单有 2 处错误，请检查后重新提交。</div>
      </div>
    </div>
  </div>

  <script src="_qingyuan.js"></script>
</body>
</html>
